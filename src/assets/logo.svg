<svg xmlns="http://www.w3.org/2000/svg" viewBox="200 40 400 350" width="100%" height="100%">
  <defs>
    <!-- Rose Gold Gradient 1 (Lighter/Highlight) -->
    <linearGradient id="rose1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4D5C1" />
      <stop offset="40%" stop-color="#DDA98B" />
      <stop offset="100%" stop-color="#A56E52" />
    </linearGradient>
    
    <!-- Rose Gold Gradient 2 (Darker/Shadow) -->
    <linearGradient id="rose2" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#75422D" />
      <stop offset="60%" stop-color="#C28B6E" />
      <stop offset="100%" stop-color="#EFC5AA" />
    </linearGradient>

    <!-- Rose Gold Gradient 3 (Midtone) -->
    <linearGradient id="rose3" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#D49E80" />
      <stop offset="50%" stop-color="#EBC0A6" />
      <stop offset="100%" stop-color="#A56E52" />
    </linearGradient>
  </defs>

  <!-- Transparent Background (as indicated in file comment) -->

  <!-- Monogram Logo Mark -->
  <g transform="translate(400, 150)">
    <!-- Bottom Loop -->
    <path d="M 20,40 C 40,80 10,110 -20,110 C -55,110 -75,75 -50,45 C -30,20 10,10 30,-5" 
          fill="none" 
          stroke="url(#rose1)" 
          stroke-width="18" 
          stroke-linecap="round" />
          
    <!-- Top Loop -->
    <path d="M -40,-25 C -55,-60 -30,-90 0,-90 C 30,-90 45,-60 25,-25 C 10,0 -30,10 -50,45" 
          fill="none" 
          stroke="url(#rose2)" 
          stroke-width="16" 
          stroke-linecap="round" />
          
    <!-- Right Leaf/Flourish -->
    <path d="M 20,-10 C 45,0 75,-15 75,-30 C 75,-30 65,5 45,15 C 25,25 0,35 -20,45" 
          fill="url(#rose3)" />
          
    <!-- Inner Leaf Detail -->
    <path d="M 15,-40 C 25,-60 40,-70 40,-70 C 40,-70 40,-45 25,-25" 
          fill="url(#rose1)" />
  </g>

  <!-- Typography: SAMA -->
  <text x="400" y="325" 
        font-family="'Playfair Display', 'Cinzel', 'Times New Roman', serif" 
        font-size="76" 
        font-weight="400" 
        fill="#333333" 
        text-anchor="middle" 
        letter-spacing="5">SAMA</text>

  <!-- Typography: COLLECTION -->
  <text x="400" y="370" 
        font-family="'Montserrat', 'Helvetica Neue', 'Arial', sans-serif" 
        font-size="15" 
        font-weight="700" 
        fill="#333333" 
        text-anchor="middle" 
        letter-spacing="9">COLLECTION</text>
</svg>
